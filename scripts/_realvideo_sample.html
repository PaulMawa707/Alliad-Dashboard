        //get para from url
        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            //alert(window.location.search.substr(1));
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        }

        async function initEnvParas() {
            // 通过 设备id 查询设备所属 节点服务器地址
            await getGtOfDevice().then(res => {
                if (res && res.data.nodeID != '0') gParaServerIp = res.data.gtAddress;
            });

            let _spitPos = gParaServerIp.indexOf(":");
            if (_spitPos != -1) {
                gParaServerIp = gParaServerIp.substring(0, _spitPos);

            }

            gDeviceId = getUrlParam("deviceId");
            gUserName = getUrlParam("username") ? getUrlParam("username") : "admin";
            gToken = getUrlParam("token");
            gStream = parseInt(getUrlParam("stream"));
            let _chs = getUrlParam("chs");
            if (_chs != null) {
                let _charr = _chs.split("_");
                for (i = 0; i < _charr.length; i++) {
                    gPlayChs[i] = {
                        'deviceId': gDeviceId,
                        'ch': _charr[i]
                    };
                }

                gPlayNum = gPlayChs.length;
            }

            if (getUrlParam("wnum") != null && parseInt(getUrlParam("wnum")) > 0)
                gUICnfWinodwsNum = parseInt(getUrlParam("wnum"));
            if (getUrlParam("panel") != null && parseInt(getUrlParam("panel")) == 0)
                gUICnfPanelDisplay = false;

            if (getUrlParam("buffer") != null)
                gBufferMs = parseInt(getUrlParam("buffer"));

            let baseWinNum = gPlayChs.length;
            if (gUICnfWinodwsNum > 0 && gUICnfWinodwsNum > baseWinNum) baseWinNum = gUICnfWinodwsNum;

            if (baseWinNum > 9) gWincount = 16;
            else if (baseWinNum > 6) gWincount = 9;
            else if (baseWinNum > 4) gWincount = 6;
            else if (baseWinNum > 2) gWincount = 4;
            else if (baseWinNum > 1) gWincount = 2;
            else gWincount = 1;
            $(".tv_video").data("wincount", gWincount); // set window count

        }

        function PlayControlStop(index) //by window no.
        {
            if (gPlayArray[index] == null) return;
            let _player = gPlayArray[index];

            if (_player.initSocketWorker == "undefined") {
                _player.pause();
                _player.unload();
                _player.detachMediaElement();
                _player.destroy();

                let videoElement = document.getElementById('videoElement' + index);
                videoElement.removeAttribute("controlsList");
                videoElement.removeAttribute("controls");
                videoElement.muted = true;
            } else {
                _player.pause();
                _player.unload();
                let box = $("#videoElement" + (index)).parent();
                box.html("");
                box.append(
                    '<video id="videoElement' + (index) + '" autoplay muted="true"></video>'
                );
            }
            _player = null;
            gPlayArray[index] = null;
            $(".tv_control_sound").eq(index - 1).html("&#xe601;");
            $(".tv_control_sound").eq(index - 1).data("state", "0");
        }

        function PlayControlSound(index, state) //by window no.
        {
            if (gPlayArray[index] == null) return false;
            let _player = gPlayArray[index];

            let videoElement = document.getElementById('videoElement' + index);
            let _mode = gPlayMode[index];
            if (parseInt(state) == 0) {
                if (_mode == 1)
                    _player.openAudio(true);
                else
                    videoElement.muted = false;
            } else {
                if (_mode == 1)
                    _player.openAudio(false);
                else
                    videoElement.muted = true;
            }
            return true;
        }

        function PlayControlStart(winIndex) // start play.  by window no.
        {
            try {
                PlayControlStop(winIndex);
            } catch (e) {
                gPlayArray[winIndex] = null;
            }
            if (!gEnableVerification) return;
            let _mediaPara = {
                type: 'flv',
                hasAudio: true,
                hasVideo: true,
                url: (protocolStr + '//')
            };
            _mediaPara.url += gParaServerIp + ":" + gParaServerPort;
            _mediaPara.url += "/flvRouter.php?live?";
            _mediaPara.url += gToken; //+winIndex;
            _mediaPara.url += "_" + gPlayChs[winIndex - 1].deviceId;
            _mediaPara.url += "_" + gPlayChs[winIndex - 1].ch;
            if (arguments[1] != null)
                _mediaPara.url += "_" + arguments[1];
            else {
                var $obj = $("#playControlStream_" + winIndex);
                _mediaPara.url += "_" + $obj.data("state");
            }

            function canvasPlay() {
                let box = $("#videoElement" + (winIndex)).parent();

                let h = box.height();
                let w = box.width();
                let url = _mediaPara.url;
                box.html("");
                box.append(
                    `<canvas id="videoElement${winIndex
                    }" width="${w}" height="${h}" autoplay muted="true" style="height: 100%; width: 100%;"></canvas>`
                );

                let temp_url = url.replace("live?", "_bywasm_live?");
                temp_url = temp_url.replace("replay?", "_bywasm_replay?");
                temp_url = temp_url.replace("fastReplay?", "_bywasm_fastReplay?");
                let video = document.getElementById("videoElement" + (winIndex));

                //alert(temp_url);

                flvPlayer = new CanvasPlayer(video, temp_url);
                gPlayArray[winIndex] = flvPlayer;
                flvPlayer.setBufferTimeMs(gBufferMs);
                flvPlayer.play();
                flvPlayer.openAudio(false);

                //that.vediowindows[index].flvPlayer = flvPlayer;
                //that.vediowindows[index].iscanvas = true;
                $(".tv_video_item_" + (winIndex) + " .tv_video_item_box_video").css("background", "");
            }


            let _mode = gPlayMode[winIndex];
            //if(_mode==1)	//屏蔽掉固定使用w方案
            {
                gPlayMode[winIndex] = 1;
                canvasPlay();

                return;
            }

            var _controlPara = {
                lazyLoadMaxDuration: 3 * 60
            };

            var flvPlayer = flvjs.createPlayer(_mediaPara, _controlPara);

            gPlayArray[winIndex] = flvPlayer;
            let _player = gPlayArray[winIndex];
            let videoElement = document.getElementById('videoElement' + winIndex);

            //controls controlsList='nofullscreen nodownload noremote noremoteplayback footbar' 
            videoElement.setAttribute("controls", "1");
            videoElement.setAttribute("controlsList", "nofullscreen nodownload noremote noremoteplayback footbar");

            flvPlayer.attachMediaElement(videoElement);
            flvPlayer.load();
            flvPlayer.play();

            //flvPlayer.on('error', err => {
            // 	  alert("network "+winIndex + " error details:"+flvjs.ErrorDetails);
            //});




            flvPlayer.on(flvjs.Events.ERROR, (errType, errDetail) => {
                let videoElement = document.getElementById('videoElement' + winIndex);
                if (
                    errType == "NetworkError" &&
                    (errDetail == "UnrecoverableEarlyEof" || errDetail == "Exception") &&
                    videoElement.currentTime == 0
                ) {
                    //alert("win: " + winIndex +  ";   error=" + errDetail + "; playTime=" + videoElement.currentTime);
                    gPlayMode[winIndex] = 1;
                    canvasPlay();
                }
            });



        }
        SSLPort = "36301";
        function wsScheme() {
            return window.location.protocol.replace(":", "") == "http" ? "ws" : "wss";
        };


        function changeWsUrl(ip, prot, type) {
            const host = window.location.hostname;
            if (wsScheme() == "ws") {
                // 有些客户是局域网映射出外网，这里需要直接使用地址栏上的地址
                if (v.proxy === true) {
                    return `ws://${host}:${prot}/${type}`;
                }

                return `ws://${ip}:${prot}/${type}`;
            } else {
                let wsurl = `wss://${ip}:${SSLPort}/${type}?ipaddr=127.0.0.1`;

                // // 有些客户是局域网映射出外网，这里需要直接使用地址栏上的地址
                // if (v.proxy === true) {
                //     return `wss://${host}:${SSLPort}/${type}?ipaddr=${ip}`;
                // }

                //子节点处理，由主节点代理过去？ 不清楚后台的逻辑
                //TODO 暂时代理到226，后续在处理
                if (ip != host) wsurl = `wss://${host}:${SSLPort}/${type}?ipaddr=${ip}`;
                return wsurl;

            }
        };



        function PlayControlAddToWin(playIndex) // add channel info to window.  start from 1
        {
            let _chObj = gPlayChs[playIndex - 1];

            $("#win_titile_" + (playIndex)).text(_chObj.deviceId + "-" + _chObj.ch);

            $(".tv_video_item_box_ch").eq(playIndex - 1).css("display", "block");
            $("#playControlStream_" + (playIndex)).css("display", "block");
        }

        // outer api
        function PlayControlAddCh(deviceId, ch, stream) // add channle and play
        {
            //if(parameters[3]!=null)
            //	winIndex


            let win = 0;
            for (i = 1; i < gPlayArray.length; i++) {
                if (gPlayArray[i] == null) {
                    win = i;
                    break;
                }
            }
            if (win == 0) win = gPlayArray.length; // add one window
            if (win < 1) win = 1;

            gPlayChs[win - 1] = {
                "deviceId": deviceId,
                "ch": ch
            };
            PlayControlAddToWin(win);
            PlayControlStart(win);
        }
